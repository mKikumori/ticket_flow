services:
  # React + Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: ticket-flow-frontend

    ports:
      - "5173:5173"

    env_file:
      - ./frontend/.env

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

    restart: unless-stopped

  # Node.js + Express
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ticket-flow-backend

    ports:
      - "5050:5050"

    env_file:
      - ./backend/.env

    environment:
      REDIS_URL: redis://redis:6379

    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

    depends_on:
      - mongo
      - redis

    restart: unless-stopped

  # MongoDB
  mongo:
    image: mongo:8

    container_name: ticket-flow-mongo

    volumes:
      - mongo_data:/data/db

    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine

    container_name: ticket-flow-redis

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes --maxmemory-policy noeviction

    volumes:
      - redis_data:/data

    restart: unless-stopped

volumes:
  frontend_node_modules:
  backend_node_modules:
  mongo_data:
  redis_data:
